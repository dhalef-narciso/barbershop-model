<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Faded Barbershop | Professional Haircuts &amp; Fades</title>
    <meta name="title" content="Faded Barbershop | Professional Haircuts &amp; Fades" />
    <meta name="description" content="Professional haircuts, skin fades, beard trims and personalised barbering at Faded Barbershop. Book your next appointment directly through WhatsApp." />
    <meta name="theme-color" content="#0B0D0F" />
    <meta name="keywords" content="barbershop Ireland, skin fade, classic haircut, beard trim, Fernando Chaves, Faded Barbershop, professional barber" />
    <meta name="author" content="Faded Barbershop" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Fonts: Oswald (Headings) & Inter (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Faded Barbershop | Professional Haircuts &amp; Fades" />
    <meta property="og:description" content="Professional haircuts, skin fades, beard trims and personalised barbering at Faded Barbershop. Book your next appointment directly through WhatsApp." />
    <meta property="og:image" content="/images/hero-fade.jpg" />
    <meta property="og:locale" content="en_IE" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Faded Barbershop | Professional Haircuts &amp; Fades" />
    <meta name="twitter:description" content="Professional haircuts, skin fades, beard trims and personalised barbering at Faded Barbershop. Book your next appointment directly through WhatsApp." />
    <meta name="twitter:image" content="/images/hero-fade.jpg" />

    <!-- Structured Data (JSON-LD) - LocalBusiness / HairSalon -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HairSalon",
      "name": "Faded Barbershop",
      "image": "/images/hero-fade.jpg",
      "description": "Professional haircuts, skin fades, beard trims and personalised barbering at Faded Barbershop. Book your next appointment directly through WhatsApp.",
      "telephone": "+353 85 262 0100",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "[Confirm address]",
        "addressLocality": "Ireland",
        "addressCountry": "IE"
      },
      "founder": {
        "@type": "Person",
        "name": "Fernando Chaves",
        "jobTitle": "Barber & Owner"
      },
      "priceRange": "€€",
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
          "opens": "09:00",
          "closes": "18:00"
        }
      ],
      "sameAs": [
        "https://www.instagram.com/faded.bbarbershop"
      ]
    }
    </script>
  </head>
  <body class="bg-brand-bg text-brand-white antialiased selection:bg-brand-orange selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
