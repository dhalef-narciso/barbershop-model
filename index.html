<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Apex Barbershop | Professional Haircuts &amp; Fades</title>
    <meta name="title" content="Apex Barbershop | Professional Haircuts &amp; Fades" />
    <meta name="description" content="Professional haircuts, skin fades, beard trims and personalised barbering at Apex Barbershop. Demonstration website." />
    <meta name="theme-color" content="#0B0D0F" />
    <meta name="keywords" content="barbershop, skin fade, classic haircut, beard trim, Apex Barbershop, professional barber" />
    <meta name="author" content="Apex Barbershop" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Fonts: Oswald (Headings) & Inter (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Apex Barbershop | Professional Haircuts &amp; Fades" />
    <meta property="og:description" content="Professional haircuts, skin fades, beard trims and personalised barbering at Apex Barbershop. Demonstration website." />
    <meta property="og:image" content="/images/hero-fade.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Apex Barbershop | Professional Haircuts &amp; Fades" />
    <meta name="twitter:description" content="Professional haircuts, skin fades, beard trims and personalised barbering at Apex Barbershop. Demonstration website." />
    <meta name="twitter:image" content="/images/hero-fade.jpg" />

    <!-- Structured Data (JSON-LD) - LocalBusiness / HairSalon -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HairSalon",
      "name": "Apex Barbershop",
      "image": "/images/hero-fade.jpg",
      "description": "Professional haircuts, skin fades, beard trims and personalised barbering at Apex Barbershop. Demonstration website.",
      "priceRange": "$$"
    }
    </script>
  </head>
  <body class="bg-brand-bg text-brand-white antialiased selection:bg-brand-orange selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
